name: Release build
run-name: Release build ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (vMAJOR.MINOR.PATCH)
        required: true
        default: v0.1.2
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}
  NDK_VERSION: 27.3.13750724

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Build both Android architectures
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$ANDROID_HOME/ndk/$NDK_VERSION/ndk-build" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
          "$ANDROID_HOME/ndk/$NDK_VERSION/ndk-build" NDK_PROJECT_PATH=android NDK_APPLICATION_MK=android/jni/Application.mk -j4
          python3 -m unittest discover -s tools/tests -v
          python3 tools/release.py android --version "$RELEASE_VERSION"
          tar -czf android-payload.tar.gz -C android/libs arm64-v8a x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-payload
          path: android-payload.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android
          path: release/*.zip
          if-no-files-found: error

  desktop:
    needs: android
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            architecture: x64
          - target: windows-arm64
            runner: windows-11-arm
            architecture: arm64
          - target: macos-arm64
            runner: macos-15
            architecture: arm64
          - target: macos-x64
            runner: macos-15-intel
            architecture: x64
          - target: linux-x64
            runner: ubuntu-22.04
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-payload
      - name: Restore device binaries and install build dependencies
        run: |
          set -euo pipefail
          mkdir -p android/libs
          tar -xzf android-payload.tar.gz -C android/libs
          python -m pip install --disable-pip-version-check PySide6==6.12.0 PyInstaller==6.22.3
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Test, freeze, and verify native desktop
        run: |
          set -euo pipefail
          python -m unittest discover -s desktop/tests -v
          python tools/package.py --no-ndk
          python tools/smoke_release.py
          python tools/release.py desktop --version "$RELEASE_VERSION" --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error
      - name: Preserve build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            build/**/*.txt
            build/**/*.log

  assemble:
    needs: [android, desktop]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify complete asset set and generate checksums
        run: python tools/release.py checksums --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
